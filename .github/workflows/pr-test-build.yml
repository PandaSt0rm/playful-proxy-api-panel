name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify router baseline
        run: git merge-base --is-ancestor "$(cat UPSTREAM_BASE)" HEAD
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet and test backend
        run: go vet ./... && go test ./...
      - name: Run static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./cmd/aiproxy/... ./internal/aiproxy/... ./internal/bootstrap/... ./internal/managementasset/... ./internal/providerprobe/...
      - name: Build branded backend artifact
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -o dist/aiproxy ./cmd/aiproxy
          test -x dist/aiproxy
          test "$(basename dist/aiproxy)" = aiproxy
      - name: Install console dependencies
        working-directory: web/console
        run: bun install --frozen-lockfile
      - name: Lint console
        working-directory: web/console
        run: bun run lint
      - name: Enforce Route Foundry design system
        working-directory: web/console
        run: bun run check:design-system
      - name: Verify exact console coverage
        working-directory: web/console
        run: bun run test:coverage
      - name: Upload console coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-coverage
          path: web/console/coverage/
      - name: Type-check console
        working-directory: web/console
        run: bun run type-check
      - name: Build single-file console
        working-directory: web/console
        run: bun run build
      - name: Install browser runtimes
        working-directory: web/console
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Verify browser and visual matrix
        working-directory: web/console
        run: bun run test:e2e
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-browser-failures
          path: |
            web/console/playwright-report/
            web/console/test-results/
      - name: Verify embedded console artifact
        run: test -s web/console/dist/index.html
