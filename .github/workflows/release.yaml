name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'
  BUN_VERSION: '1.3.14'

jobs:
  build-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build embedded console
        working-directory: web/console
        run: bun install --frozen-lockfile && bun run type-check && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: management-panel
          path: web/console/dist/index.html
          if-no-files-found: error

  build-archives:
    needs: build-panel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v5
        with:
          name: management-panel
          path: panel
      - name: Build platform archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          archive="aiproxy_${version}_${GOOS}_${GOARCH}"
          stage="dist/${archive}"
          binary="aiproxy"
          extension="tar.gz"
          if [[ "$GOOS" == windows ]]; then
            binary="aiproxy.exe"
            extension="zip"
          fi
          mkdir -p "$stage"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.BuildDate=${build_date}" \
            -o "$stage/$binary" ./cmd/aiproxy/
          cp panel/index.html "$stage/management.html"
          cp LICENSE README.md config.example.yaml "$stage/"
          if [[ "$extension" == zip ]]; then
            (cd dist && zip -qr "${archive}.zip" "$archive")
          else
            tar -C dist -czf "dist/${archive}.tar.gz" "$archive"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/aiproxy_*.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  publish:
    needs: [build-panel, build-archives]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: management-panel
          path: panel
      - name: Stage updater asset
        run: mv panel/index.html dist/management.html
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum aiproxy_* management.html > checksums.txt
          gh release create "$GITHUB_REF_NAME" aiproxy_* management.html checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
